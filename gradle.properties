# Project-wide Gradle settings.
# org.gradle.jvmargs is intentionally not set here: PhoneIDE's
# ToolchainEnvWriter pins a single device-sized value in
# GRADLE_USER_HOME/gradle.properties (kotlin.in-process, pinned heap,
# SerialGC) so every project reuses the same warm daemon. A per-project
# -Xmx here would force a second incompatible daemon and waste 1 GB+
# and a full cold start on every project switch.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.builtInKotlin=false
android.newDsl=false
